<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ── Firebase check ───────────────────────────────
const isConfigured = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
let db = null;
if(isConfigured){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}

// ── Firebase helpers ─────────────────────────────
const FB = {
  getUsers: ()=> db.ref('tw_users').once('value').then(s=>s.val()||{}),
  setUser: (u)=> db.ref(`tw_users/${u.id}`).set(u),
  getTrips: ()=> db.ref('tw_trips').once('value').then(s=>s.val()||{}),
  setTrip: (t)=> db.ref(`tw_trips/${t.id}`).set(t),
  listenTrip: (id,cb)=>{ db.ref(`tw_trips/${id}`).on('value',s=>cb(s.val())); },
  offTrip: (id)=>{ db.ref(`tw_trips/${id}`).off(); },
};

// ── Helpers ──────────────────────────────────────
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=(n,d=2)=>Number(n||0).toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDate=(ts)=>new Date(ts).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
const CATS=[{id:"food",label:"อาหาร",icon:"🍜"},{id:"transport",label:"เดินทาง",icon:"🚗"},{id:"hotel",label:"ที่พัก",icon:"🏨"},{id:"activity",label:"กิจกรรม",icon:"🎡"},{id:"shopping",label:"ช้อปปิ้ง",icon:"🛍️"},{id:"other",label:"อื่นๆ",icon:"💰"}];
const EMOJIS=["✈️","🏖️","⛰️","🗼","🎑","🌏","🚢","🏕️","🎿","🌴","🎭","🗺️"];

function calcSettlements(balances){
  const cred=balances.filter(b=>b.diff>0.01).map(b=>({...b,rem:b.diff}));
  const debt=balances.filter(b=>b.diff<-0.01).map(b=>({...b,rem:Math.abs(b.diff)}));
  const txs=[];let ci=0,di=0;
  while(ci<cred.length&&di<debt.length){
    const c=cred[ci],d=debt[di];const amt=Math.min(c.rem,d.rem);
    if(amt>0.01)txs.push({from:d.name,to:c.name,amount:amt});
    c.rem-=amt;d.rem-=amt;if(c.rem<0.01)ci++;if(d.rem<0.01)di++;
  }
  return txs;
}

// ── Main App ─────────────────────────────────────
function App(){
  const[currentUser,setCurrentUser]=useState(null);
  const[screen,setScreen]=useState("home");
  const[tripId,setTripId]=useState(null);
  const[liveTrip,setLiveTrip]=useState(null);
  const[myTrips,setMyTrips]=useState([]);
  const[modal,setModal]=useState(null);
  const[showMenu,setShowMenu]=useState(false);
  const[loading,setLoading]=useState(true);
  const[authMode,setAuthMode]=useState("login");
  const[authForm,setAuthForm]=useState({username:"",password:"",displayName:""});
  const[authError,setAuthError]=useState("");
  const[tripForm,setTripForm]=useState({name:"",emoji:"✈️",currency:"THB"});
  const[joinCode,setJoinCode]=useState("");
  const[expForm,setExpForm]=useState({amount:"",category:"food",note:"",paidBy:""});
  const[incForm,setIncForm]=useState({amount:"",note:""});
  const[listTab,setListTab]=useState("expense");
  const[toast,setToast]=useState("");
  const[closingTrip,setClosingTrip]=useState(false);

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2500);};

  // Load current user from localStorage
  useEffect(()=>{
    const cu=JSON.parse(localStorage.getItem("tw_cur")||"null");
    if(cu)setCurrentUser(cu);
    setLoading(false);
  },[]);

  // Load my trips
  useEffect(()=>{
    if(!currentUser)return;
    FB.getTrips().then(tripsObj=>{
      const all=Object.values(tripsObj);
      setMyTrips(all.filter(t=>t.members?.find(m=>m.id===currentUser.id)));
    });
  },[currentUser]);

  // Real-time listener for active trip
  useEffect(()=>{
    if(!tripId)return;
    FB.listenTrip(tripId,(data)=>{
      if(data){
        setLiveTrip(data);
        setMyTrips(prev=>prev.map(t=>t.id===data.id?data:t).concat(prev.find(t=>t.id===data.id)?[]:[data]));
      }
    });
    return()=>FB.offTrip(tripId);
  },[tripId]);

  const totalExp=(t)=>(t.expenses||[]).reduce((s,e)=>s+e.amount,0);
  const totalInc=(t)=>(t.incomes||[]).reduce((s,i)=>s+i.amount,0);
  const netTotal=(t)=>totalExp(t)-totalInc(t);
  const perPerson=(t)=>t.members?.length>0?netTotal(t)/t.members.length:0;
  const memberBals=(t)=>{
    const pp=perPerson(t);
    return(t.members||[]).map(m=>{
      const paid=(t.expenses||[]).filter(e=>e.paidBy===m.id).reduce((s,e)=>s+e.amount,0);
      return{...m,paid,share:pp,diff:paid-pp};
    });
  };

  // Auth
  const handleAuth=async()=>{
    setAuthError("");
    const uname=authForm.username.trim().toLowerCase();
    if(!uname||!authForm.password){setAuthError("กรุณากรอกข้อมูลให้ครบ");return;}
    const usersObj=await FB.getUsers();
    const usersArr=Object.values(usersObj);
    if(authMode==="register"){
      if(usersArr.find(u=>u.username===uname)){setAuthError("ชื่อผู้ใช้นี้มีอยู่แล้ว");return;}
      const nu={id:uid(),username:uname,password:authForm.password,displayName:authForm.displayName.trim()||uname};
      await FB.setUser(nu);
      setCurrentUser(nu);localStorage.setItem("tw_cur",JSON.stringify(nu));
    }else{
      const user=usersArr.find(u=>u.username===uname&&u.password===authForm.password);
      if(!user){setAuthError("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");return;}
      setCurrentUser(user);localStorage.setItem("tw_cur",JSON.stringify(user));
    }
    setAuthForm({username:"",password:"",displayName:""});
  };

  const logout=()=>{
    setCurrentUser(null);localStorage.removeItem("tw_cur");
    setScreen("home");setTripId(null);setLiveTrip(null);setMyTrips([]);setShowMenu(false);
  };

  // Create trip
  const createTrip=async()=>{
    if(!tripForm.name.trim())return;
    const code=Math.random().toString(36).slice(2,8).toUpperCase();
    const trip={id:uid(),name:tripForm.name.trim(),emoji:tripForm.emoji,currency:tripForm.currency,code,createdAt:Date.now(),creatorId:currentUser.id,members:[{id:currentUser.id,name:currentUser.displayName}],expenses:[],incomes:[],status:"active"};
    await FB.setTrip(trip);
    setMyTrips(p=>[...p,trip]);
    setModal(null);setTripForm({name:"",emoji:"✈️",currency:"THB"});
    setTripId(trip.id);setLiveTrip(trip);setScreen("trip");setListTab("expense");
  };

  // Join trip
  const joinTrip=async()=>{
    const code=joinCode.trim().toUpperCase();
    const tripsObj=await FB.getTrips();
    const trip=Object.values(tripsObj).find(t=>t.code===code);
    if(!trip){showToast("❌ ไม่พบรหัสทริปนี้");return;}
    if(trip.status==="closed"){showToast("🔒 ทริปนี้ปิดแล้ว");return;}
    if(trip.members.find(m=>m.id===currentUser.id)){
      setTripId(trip.id);setLiveTrip(trip);setScreen("trip");setModal(null);setJoinCode("");return;
    }
    const updated={...trip,members:[...trip.members,{id:currentUser.id,name:currentUser.displayName}]};
    await FB.setTrip(updated);
    setTripId(updated.id);setLiveTrip(updated);
    setMyTrips(p=>p.find(t=>t.id===updated.id)?p.map(t=>t.id===updated.id?updated:t):[...p,updated]);
    setScreen("trip");setModal(null);setJoinCode("");
    showToast("✅ เข้าร่วมทริปแล้ว!");
  };

  // Add expense
  const addExpense=async()=>{
    const amt=parseFloat(expForm.amount);if(!amt||amt<=0)return;
    const paidById=expForm.paidBy||currentUser.id;
    const expense={id:uid(),amount:amt,category:expForm.category,note:expForm.note.trim()||CATS.find(c=>c.id===expForm.category)?.label,paidBy:paidById,paidByName:liveTrip.members.find(m=>m.id===paidById)?.name||currentUser.displayName,addedBy:currentUser.id,createdAt:Date.now()};
    const updT={...liveTrip,expenses:[expense,...(liveTrip.expenses||[])]};
    await FB.setTrip(updT);
    setModal(null);setExpForm({amount:"",category:"food",note:"",paidBy:""});
    showToast("✅ บันทึกรายจ่ายแล้ว");
  };

  // Add income
  const addIncome=async()=>{
    const amt=parseFloat(incForm.amount);if(!amt||amt<=0)return;
    const income={id:uid(),amount:amt,note:incForm.note.trim()||"งบกลาง",addedBy:currentUser.id,addedByName:currentUser.displayName,createdAt:Date.now()};
    const updT={...liveTrip,incomes:[income,...(liveTrip.incomes||[])]};
    await FB.setTrip(updT);
    setModal(null);setIncForm({amount:"",note:""});showToast("✅ เพิ่มงบกลางแล้ว");
  };

  const deleteExpense=async(expId)=>{
    const updT={...liveTrip,expenses:liveTrip.expenses.filter(e=>e.id!==expId)};
    await FB.setTrip(updT);showToast("🗑️ ลบรายการแล้ว");
  };

  const deleteIncome=async(incId)=>{
    const updT={...liveTrip,incomes:(liveTrip.incomes||[]).filter(i=>i.id!==incId)};
    await FB.setTrip(updT);showToast("🗑️ ลบงบกลางแล้ว");
  };

  const closeTrip=async()=>{
    const t=liveTrip;
    const balances=memberBals(t);const settlements=calcSettlements(balances);
    const catSummary=CATS.map(c=>({...c,total:(t.expenses||[]).filter(e=>e.category===c.id).reduce((s,e)=>s+e.amount,0)})).filter(c=>c.total>0);
    const receipt={generatedAt:Date.now(),generatedBy:currentUser.displayName,totalExpenses:totalExp(t),totalIncome:totalInc(t),netTotal:netTotal(t),perPerson:perPerson(t),memberCount:t.members.length,balances,settlements,catSummary};
    const updT={...t,status:"closed",closedAt:Date.now(),receipt};
    await FB.setTrip(updT);
    setClosingTrip(false);setModal("receipt");showToast("🔒 ปิดทริปและออกใบเสร็จแล้ว");
  };

  const shareCode=async(trip)=>{
    const text=`🌏 ร่วมทริป "${trip.name}" ใน TripWallet!\nรหัสทริป: ${trip.code}`;
    if(navigator.share){try{await navigator.share({title:"TripWallet",text});return;}catch{}}
    if(navigator.clipboard){await navigator.clipboard.writeText(text);showToast("📋 คัดลอกรหัสแล้ว!");}
  };

  const openTrip=(t)=>{setTripId(t.id);setLiveTrip(t);setScreen("trip");setListTab("expense");};

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100dvh",background:"#1d5954",color:"#fff",fontFamily:"Sarabun,sans-serif",flexDirection:"column",gap:"12px"}}><div style={{fontSize:"44px"}}>✈️</div><div style={{fontSize:"16px",fontWeight:"600"}}>กำลังโหลด...</div></div>;

  if(!currentUser)return(
    <div className="auth-bg">
      <div style={{fontSize:"48px",marginBottom:"6px",position:"relative",zIndex:1}}>✈️</div>
      <div className="auth-logo">Trip<span>Wallet</span></div>
      <div className="auth-sub">ผู้ช่วยการเงินสำหรับทริปเที่ยว</div>
      <div className="auth-card">
        <div className="atabs">
          <button className={`atab${authMode==="login"?" on":""}`} onClick={()=>{setAuthMode("login");setAuthError("")}}>เข้าสู่ระบบ</button>
          <button className={`atab${authMode==="register"?" on":""}`} onClick={()=>{setAuthMode("register");setAuthError("")}}>สมัครสมาชิก</button>
        </div>
        {authMode==="register"&&<div className="field"><label>ชื่อที่แสดง</label><input placeholder="เช่น น้องแบงค์" value={authForm.displayName} onChange={e=>setAuthForm(p=>({...p,displayName:e.target.value}))}/></div>}
        <div className="field"><label>ชื่อผู้ใช้</label><input placeholder="username" value={authForm.username} onChange={e=>setAuthForm(p=>({...p,username:e.target.value}))}/></div>
        <div className="field"><label>รหัสผ่าน</label><input type="password" placeholder="••••••" value={authForm.password} onChange={e=>setAuthForm(p=>({...p,password:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&handleAuth()}/></div>
        {authError&&<div style={{color:"var(--rust)",fontSize:"13px",marginBottom:"12px",fontWeight:"600"}}>⚠️ {authError}</div>}
        <button className="btn btn-teal btn-full" onClick={handleAuth}>{authMode==="login"?"เข้าสู่ระบบ":"สมัครสมาชิก"}</button>
      </div>
    </div>
  );

  return(
    <div className="app" onClick={()=>showMenu&&setShowMenu(false)}>
      <div className="hdr">
        {screen==="trip"&&<button className="hdr-back" onClick={()=>{setScreen("home");setTripId(null);}}>←</button>}
        <div className="hdr-title">{screen==="trip"?`${liveTrip?.emoji} ${liveTrip?.name}`:"TripWallet ✈️"}</div>
        {screen==="trip"&&liveTrip?.status==="active"&&<span style={{fontSize:"11px",color:"rgba(255,255,255,.7)",marginRight:"4px",display:"flex",alignItems:"center"}}><span className="live-dot"/>Live</span>}
        <div className="hdr-av" onClick={e=>{e.stopPropagation();setShowMenu(!showMenu)}}>{currentUser.displayName[0].toUpperCase()}</div>
      </div>

      {showMenu&&<div className="umenu" onClick={e=>e.stopPropagation()}>
        <div className="umenu-n">👤 {currentUser.displayName}</div>
        <div className="umenu-i danger" onClick={logout}>🚪 ออกจากระบบ</div>
      </div>}
      {toast&&<div className="toast">{toast}</div>}

      <div className="scroll">
        {/* ── HOME ── */}
        {screen==="home"&&<>
          <div className="hero">
            <div className="h-greet">สวัสดี 👋</div>
            <div className="h-name">{currentUser.displayName}</div>
            <div className="h-grid">
              <div className="h-stat"><div className="h-lbl">ทริปของฉัน</div><div className="h-val">{myTrips.length}</div><div className="h-sub">ทริปทั้งหมด</div></div>
              <div className="h-stat"><div className="h-lbl">ยอดรวมสุทธิ</div><div className="h-val">{fmt(myTrips.reduce((s,t)=>s+netTotal(t),0),0)}</div><div className="h-sub">หักงบกลางแล้ว</div></div>
            </div>
          </div>
          <div className="stitle">ทริปของฉัน</div>
          {myTrips.length===0
            ?<div className="empty"><div className="empty-ic">🗺️</div><h3>ยังไม่มีทริป</h3><p>สร้างทริปใหม่หรือเข้าร่วมทริปกับเพื่อน</p></div>
            :myTrips.map(t=><div key={t.id} className={`tc${t.status==="closed"?" closed":""}`} onClick={()=>openTrip(t)}>
              <div className="tc-top"><div className="tc-icon">{t.emoji}</div><div className="tc-info"><div className="tc-name">{t.name}<span className={`chip ${t.status==="closed"?"ch-grey":"ch-teal"}`}>{t.status==="closed"?"🔒 ปิดแล้ว":"✈️ กำลังเดินทาง"}</span></div><div className="tc-date">{fmtDate(t.createdAt)} · {t.members.length} คน{t.creatorId===currentUser.id?" · 👑":""}</div></div></div>
              <div className="tc-foot"><div className="tc-meta">🧾 {(t.expenses||[]).length} รายจ่าย{(t.incomes||[]).length>0?` · 💚 ${fmt(totalInc(t),0)}`:""}</div><div className="tc-amt">{fmt(netTotal(t),0)} {t.currency}</div></div>
            </div>)
          }
          <div style={{height:"90px"}}/>
        </>}

        {/* ── TRIP DETAIL ── */}
        {screen==="trip"&&liveTrip&&(()=>{
          const t=liveTrip;
          const isCreator=t.creatorId===currentUser.id;
          const balances=memberBals(t);
          const settlements=calcSettlements(balances);
          const myBal=balances.find(b=>b.id===currentUser.id);
          return<>
            <div className="codebar">
              <div className="codebox"><div><div className="code-lbl">รหัสทริป (แชร์ให้เพื่อน)</div><div className="code-val">{t.code}</div></div></div>
              <button className="btn btn-blue btn-sm" onClick={()=>shareCode(t)}>📤 แชร์</button>
              {t.status==="closed"&&<button className="btn btn-ghost btn-sm" onClick={()=>setModal("receipt")}>🧾 ใบเสร็จ</button>}
            </div>

            {t.status==="closed"
              ?<div className="notice n-warn" style={{marginTop:"10px"}}>🔒 ทริปปิดแล้ว · ทุกคนยังดูรายการและใบเสร็จได้</div>
              :<div className="notice n-teal" style={{marginTop:"10px"}}>
                <span className="live-dot"/>ข้อมูล Real-time — ทุกคนเห็นการเปลี่ยนแปลงพร้อมกัน
              </div>
            }

            <div className="sc">
              <div className="sc-lbl">ยอดสุทธิ (หักงบกลาง)</div>
              <div><span className="sc-val">{fmt(netTotal(t))}</span><span className="sc-cur">{t.currency}</span></div>
              <div className="sc-row">
                <div className="sc-item"><div className="sc-iv">{fmt(totalExp(t),0)}</div><div className="sc-il">รายจ่ายรวม</div></div>
                <div className="sc-item"><div className="sc-iv" style={{color:"#7eefc0"}}>{fmt(totalInc(t),0)}</div><div className="sc-il">งบกลาง</div></div>
                <div className="sc-item"><div className="sc-iv">{fmt(perPerson(t))}</div><div className="sc-il">ต่อคน ({t.members.length})</div></div>
              </div>
            </div>

            {isCreator&&t.status==="active"&&<div style={{margin:"0 13px 4px"}}>
              <button className="btn btn-danger btn-full" onClick={()=>setClosingTrip(true)}>🔒 ปิดทริป & ออกใบเสร็จสรุปให้ทุกคน</button>
            </div>}

            <div className="stitle">สมาชิก ({t.members.length} คน)</div>
            <div className="mwrap">
              {t.members.map(m=><div key={m.id} className={`mchip${m.id===currentUser.id?" me":""}`}>
                <div className="mav">{m.name[0]}</div>
                <div className="mname">{m.name}{m.id===currentUser.id?" (ฉัน)":""}{m.id===t.creatorId?" 👑":""}</div>
              </div>)}
            </div>

            {t.members.length>1&&<>
              <div className="stitle">สรุปยอดแต่ละคน</div>
              {balances.map(b=><div key={b.id} className="bal">
                <div className="bal-l"><div className="mav" style={{width:32,height:32,fontSize:13}}>{b.name[0]}</div>
                  <div><div className="bal-n">{b.name}{b.id===currentUser.id?" 👤":""}</div><div className="bal-s">ส่วนแบ่ง {fmt(b.share)}</div></div></div>
                <div className="bal-r">
                  <div className="bal-p">จ่าย {fmt(b.paid)}</div>
                  <div className={b.diff>=0?"bal-pos":"bal-neg"}>{b.diff>=0?`+${fmt(b.diff)} ได้คืน`:`${fmt(Math.abs(b.diff))} ต้องจ่าย`}</div>
                </div>

            </div>

            {listTab==="expense"&&<>
              {(t.expenses||[]).length===0
                ?<div className="empty" style={{padding:"28px"}}><div className="empty-ic">🧾</div><h3>ยังไม่มีรายจ่าย</h3></div>
                :(t.expenses||[]).map(e=>{const cat=CATS.find(c=>c.id===e.category);return(
                  <div key={e.id} className="expitem">
                    <div className="exp-ic">{cat?.icon||"💰"}</div>
                    <div className="exp-bd"><div className="exp-tt">{e.note}</div><div className="exp-mt">{cat?.label} · {fmtDate(e.createdAt)}</div></div>
                    <div className="exp-rg">
                      <div className="exp-am">-{fmt(e.amount)}</div>
                      <div className="exp-pb">จ่ายโดย {e.paidByName}</div>
                      {(e.addedBy===currentUser.id||isCreator)&&t.status==="active"&&<button className="btn btn-xs btn-danger" style={{marginTop:"4px"}} onClick={()=>deleteExpense(e.id)}>ลบ</button>}
                    </div>
                  </div>
                );})}
            </>}

            {listTab==="income"&&<>
              {(t.incomes||[]).length===0
                ?<div className="empty" style={{padding:"28px"}}><div className="empty-ic">💰</div><h3>ยังไม่มีงบกลาง</h3><p>งบกลางหักออกจากยอดรวมก่อนหารต่อคน</p></div>
                :(t.incomes||[]).map(i=><div key={i.id} className="inc-card">
                  <div className="inc-icon">💚</div>
                  <div className="inc-info"><div className="inc-title">{i.note}</div><div className="inc-meta">เพิ่มโดย {i.addedByName} · {fmtDate(i.createdAt)}</div></div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div className="inc-amt">+{fmt(i.amount)}</div>
                    {(i.addedBy===currentUser.id||isCreator)&&t.status==="active"&&<button className="btn btn-xs btn-ghost" style={{marginTop:"4px"}} onClick={()=>deleteIncome(i.id)}>ลบ</button>}
                  </div>
                </div>)}
            </>}
            <div style={{height:"100px"}}/>
          </>;
        })()}
      </div>

      {/* FAB */}
      {screen==="home"&&<div className="fab">
        <button className="fab-btn fab-c" onClick={()=>setModal("createTrip")}>✈️ สร้างทริป</button>
        <button className="fab-btn fab-j" onClick={()=>setModal("joinTrip")}>🔗 เข้าร่วม</button>
      </div>}
      {screen==="trip"&&liveTrip?.status==="active"&&<div className="fab">
        <button className="fab-btn fab-e" style={{flex:2}} onClick={()=>{setExpForm({amount:"",category:"food",note:"",paidBy:currentUser.id});setModal("addExpense")}}>➕ เพิ่มรายจ่าย</button>
        <button className="fab-btn fab-i" onClick={()=>{setIncForm({amount:"",note:""});setModal("addIncome")}}>💚 งบกลาง</button>
      </div>}

      {/* ── MODALS ── */}
      {modal==="createTrip"&&<div className="overlay" onClick={()=>setModal(null)}><div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sh-handle"/><div className="sh-title">สร้างทริปใหม่ 🗺️</div>
        <div className="field"><label>ชื่อทริป</label><input placeholder="เช่น เที่ยวเชียงใหม่ มีนาคม" value={tripForm.name} onChange={e=>setTripForm(p=>({...p,name:e.target.value}))}/></div>
        <div className="field"><label>ไอคอน</label><div style={{display:"flex",flexWrap:"wrap",gap:"7px"}}>{EMOJIS.map(em=><button key={em} onClick={()=>setTripForm(p=>({...p,emoji:em}))} style={{fontSize:"22px",width:"42px",height:"42px",border:tripForm.emoji===em?"2px solid var(--teal)":"2px solid var(--border)",borderRadius:"10px",background:tripForm.emoji===em?"var(--teal-lt)":"#fff",cursor:"pointer"}}>{em}</button>)}</div></div>
        <div className="field"><label>สกุลเงิน</label><select value={tripForm.currency} onChange={e=>setTripForm(p=>({...p,currency:e.target.value}))}><option value="THB">THB – บาทไทย</option><option value="USD">USD – ดอลลาร์</option><option value="EUR">EUR – ยูโร</option><option value="JPY">JPY – เยน</option><option value="KRW">KRW – วอน</option><option value="SGD">SGD – ดอลลาร์สิงคโปร์</option></select></div>
        <div style={{display:"flex",gap:"9px"}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn btn-teal" style={{flex:1}} onClick={createTrip} disabled={!tripForm.name.trim()}>สร้างทริป</button></div>
      </div></div>}

      {modal==="joinTrip"&&<div className="overlay" onClick={()=>setModal(null)}><div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sh-handle"/><div className="sh-title">เข้าร่วมทริป 🔗</div>
        <div className="field"><label>รหัสทริป 6 ตัว</label><input placeholder="ABC123" value={joinCode} onChange={e=>setJoinCode(e.target.value.toUpperCase())} style={{letterSpacing:"4px",fontSize:"24px",fontWeight:"800",textAlign:"center"}}/></div>
        <p style={{fontSize:"13px",color:"var(--muted)",marginBottom:"16px",lineHeight:"1.7"}}>ขอรหัสจากเพื่อนที่สร้างทริป แล้วพิมพ์ลงมาได้เลย</p>
        <div style={{display:"flex",gap:"9px"}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn btn-gold" style={{flex:1}} onClick={joinTrip} disabled={joinCode.length<4}>เข้าร่วม</button></div>
      </div></div>}

      {modal==="addExpense"&&liveTrip&&<div className="overlay" onClick={()=>setModal(null)}><div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sh-handle"/><div className="sh-title">เพิ่มรายจ่าย 🧾</div>
        <div className="field"><label>จำนวนเงิน ({liveTrip.currency})</label><input type="number" placeholder="0.00" inputMode="decimal" value={expForm.amount} onChange={e=>setExpForm(p=>({...p,amount:e.target.value}))} style={{fontSize:"28px",fontWeight:"800",textAlign:"center",color:"var(--rust)"}}/></div>
        <div className="field"><label>หมวดหมู่</label><div className="catgrid">{CATS.map(c=><div key={c.id} className={`catbtn${expForm.category===c.id?" on":""}`} onClick={()=>setExpForm(p=>({...p,category:c.id}))}><div className="catbtn-ic">{c.icon}</div><div className="catbtn-lb">{c.label}</div></div>)}</div></div>
        <div className="field"><label>รายละเอียด</label><input placeholder="เช่น ข้าวผัดกุ้ง, ค่าแท็กซี่..." value={expForm.note} onChange={e=>setExpForm(p=>({...p,note:e.target.value}))}/></div>
        {liveTrip.members.length>1&&<div className="field"><label>ผู้จ่าย</label><select value={expForm.paidBy||currentUser.id} onChange={e=>setExpForm(p=>({...p,paidBy:e.target.value}))}>{liveTrip.members.map(m=><option key={m.id} value={m.id}>{m.name}{m.id===currentUser.id?" (ฉัน)":""}</option>)}</select></div>}
        <div style={{display:"flex",gap:"9px"}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn btn-teal" style={{flex:2}} onClick={addExpense} disabled={!expForm.amount||parseFloat(expForm.amount)<=0}>บันทึกรายจ่าย</button></div>
      </div></div>}

      {modal==="addIncome"&&liveTrip&&<div className="overlay" onClick={()=>setModal(null)}><div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sh-handle"/><div className="sh-title">เพิ่มงบกลาง 💚</div>
        <div className="notice n-teal" style={{marginBottom:"14px",marginLeft:0,marginRight:0}}>งบกลางจะหักออกจากยอดรวมก่อนคำนวณหารต่อคน</div>
        <div className="field"><label>จำนวนงบกลาง ({liveTrip.currency})</label><input type="number" placeholder="0.00" inputMode="decimal" value={incForm.amount} onChange={e=>setIncForm(p=>({...p,amount:e.target.value}))} style={{fontSize:"28px",fontWeight:"800",textAlign:"center",color:"var(--green)"}}/></div>
        <div className="field"><label>รายละเอียด</label><input placeholder="เช่น เงินกลุ่ม, งบสนับสนุน..." value={incForm.note} onChange={e=>setIncForm(p=>({...p,note:e.target.value}))}/></div>
        <div style={{display:"flex",gap:"9px"}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setModal(null)}>ยกเลิก</button><button className="btn btn-green" style={{flex:2}} onClick={addIncome} disabled={!incForm.amount||parseFloat(incForm.amount)<=0}>เพิ่มงบกลาง</button></div>
      </div></div>}

      {closingTrip&&liveTrip&&<div className="overlay" onClick={()=>setClosingTrip(false)}><div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sh-handle"/><div className="sh-title">ปิดทริป & ออกใบเสร็จ 🔒</div>
        <div className="notice n-warn" style={{marginBottom:"14px",marginLeft:0,marginRight:0}}>⚠️ เมื่อปิดแล้วจะไม่สามารถเพิ่มรายการใหม่ได้ แต่ทุกคนยังดูรายการและใบเสร็จได้ตลอด</div>
        <div style={{background:"var(--sand)",borderRadius:"12px",padding:"13px",marginBottom:"15px"}}>
          <div style={{fontSize:"11px",fontWeight:"800",color:"var(--muted)",letterSpacing:".6px",textTransform:"uppercase",marginBottom:"10px"}}>ตรวจสอบก่อนปิด</div>
          <div className="cp-row"><span>รายจ่ายรวม</span><span style={{fontWeight:800}}>{fmt(totalExp(liveTrip))} {liveTrip.currency}</span></div>
          {totalInc(liveTrip)>0&&<div className="cp-row"><span>งบกลาง</span><span style={{fontWeight:800,color:"var(--green)"}}>-{fmt(totalInc(liveTrip))} {liveTrip.currency}</span></div>}
          <div className="cp-row"><span>สมาชิก</span><span style={{fontWeight:800}}>{liveTrip.members.length} คน</span></div>
          <div className="cp-tot"><span>ต่อคน</span><span style={{color:"var(--teal)"}}>{fmt(perPerson(liveTrip))} {liveTrip.currency}</span></div>
        </div>
        <div style={{display:"flex",gap:"9px"}}><button className="btn btn-ghost" style={{flex:1}} onClick={()=>setClosingTrip(false)}>ยกเลิก</button><button className="btn btn-danger" style={{flex:2}} onClick={closeTrip}>🔒 ยืนยันปิดทริป</button></div>
      </div></div>}

      {modal==="receipt"&&liveTrip?.receipt&&<div className="overlay" onClick={()=>setModal(null)}><div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sh-handle"/><div className="sh-title">ใบเสร็จสรุปทริป 🧾</div>
        <div className="rcpt">
          <div className="rcpt-hdr"><div style={{fontSize:"34px",marginBottom:"5px"}}>{liveTrip.emoji}</div><div className="rcpt-t">{liveTrip.name}</div><div className="rcpt-m">{fmtDate(liveTrip.createdAt)} — {fmtDate(liveTrip.closedAt)}</div><div className="rcpt-m">{liveTrip.members.length} คน · สรุปโดย {liveTrip.receipt.generatedBy}</div></div>
          <div className="rcpt-sec"><div className="rcpt-stitle">💰 สรุปการเงิน</div>
            <div className="rcpt-row"><span className="rcpt-rl">รายจ่ายรวม</span><span className="rcpt-rv">{fmt(liveTrip.receipt.totalExpenses)} {liveTrip.currency}</span></div>
            {liveTrip.receipt.totalIncome>0&&<div className="rcpt-row"><span className="rcpt-rl">งบกลาง (หัก)</span><span className="rcpt-rv" style={{color:"var(--green)"}}>-{fmt(liveTrip.receipt.totalIncome)} {liveTrip.currency}</span></div>}
            <div className="rcpt-tot"><span>ยอดสุทธิ</span><span>{fmt(liveTrip.receipt.netTotal)} {liveTrip.currency}</span></div>
            <div className="rcpt-row" style={{paddingTop:"6px"}}><span className="rcpt-rl">ต่อคน ({liveTrip.receipt.memberCount} คน)</span><span style={{fontWeight:800,color:"var(--teal)",fontSize:"16px"}}>{fmt(liveTrip.receipt.perPerson)} {liveTrip.currency}</span></div>
          </div>
          {liveTrip.receipt.catSummary.length>0&&<div className="rcpt-sec"><div className="rcpt-stitle">📊 รายจ่ายตามหมวดหมู่</div>{liveTrip.receipt.catSummary.map(c=><div key={c.id} className="rcpt-row"><span className="rcpt-rl">{c.icon} {c.label}</span><span className="rcpt-rv">{fmt(c.total)} {liveTrip.currency}</span></div>)}</div>}
          <div className="rcpt-sec"><div className="rcpt-stitle">👥 สรุปรายบุคคล</div>
            {liveTrip.receipt.balances.map(b=><div key={b.id} style={{padding:"8px 0",borderBottom:"1px solid var(--blt)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"3px"}}>
                <span style={{fontWeight:700,fontSize:"14px"}}>{b.name}{b.id===currentUser.id?" 👤":""}</span>
                <span style={{fontSize:"13px",fontWeight:800,color:b.diff>=0?"var(--green)":"var(--rust)"}}>{b.diff>=0?`+${fmt(b.diff)} ได้คืน`:`${fmt(Math.abs(b.diff))} ต้องจ่าย`}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:"11px",color:"var(--muted)"}}><span>จ่ายจริง {fmt(b.paid)}</span><span>ส่วนแบ่ง {fmt(b.share)}</span></div>
            </div>)}
          </div>
          <div className="rcpt-sec"><div className="rcpt-stitle">💸 วิธีจ่ายเงินคืน</div>
            {liveTrip.receipt.settlements.length===0
              ?<div style={{textAlign:"center",padding:"10px 0",color:"var(--green)",fontWeight:"700",fontSize:"14px"}}>✅ ไม่มียอดค้างชำระ!</div>
              :liveTrip.receipt.settlements.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:"7px",padding:"8px 0",borderBottom:"1px solid var(--blt)",fontSize:"13px"}}>
                <span style={{fontWeight:800}}>{s.from}</span>
                <span style={{color:"var(--gold)",fontSize:"16px"}}>→</span>
                <span style={{fontWeight:800}}>{s.to}</span>
                <span style={{marginLeft:"auto",fontWeight:800,color:"var(--teal)",fontSize:"14px"}}>{fmt(s.amount)} {liveTrip.currency}</span>
              </div>)}
          </div>
        </div>
        <button className="btn btn-ghost btn-full" onClick={()=>setModal(null)}>ปิด</button>
      </div></div>}
    </div>
  );
}

// ── Mount ────────────────────────────────────────
function Root(){
  if(!isConfigured) return <SetupScreen/>;
  return <App/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
